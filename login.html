<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema - WEG México</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      background-color: #1e293b;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      border: 1px solid #334155;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-container h1 {
      color: #0284c7;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .logo-container p {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #0369a1;
    }

    .btn-submit:focus {
      outline: 2px solid #38bdf8;
    }

    .error-message {
      background-color: rgba(220, 38, 38, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-container">
      <h1>WEG CAPACITACIÓN</h1>
      <p>Ingrese sus credenciales para acceder</p>
    </div>

    <div id="error-box" class="error-message"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Ingrese usuario" required autocomplete="off">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingrese contraseña" required autocomplete="off">
      </div>

      <button type="submit" id="login-btn" class="btn-submit">Iniciar Sesión</button>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const userInput = document.getElementById('username');
    const passInput = document.getElementById('password');
    const loginBtn = document.getElementById('login-btn');
    const errorBox = document.getElementById('error-box');

    // Procesar el envío del formulario
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = userInput.value.trim();
      const password = passInput.value.trim();

      try {
        // Petición al endpoint /login con URL completa de Render
        const response = await fetch('https://weg-server-acces.onrender.com/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          errorBox.style.display = "none";
          window.location.href = data.redirectTo;
        } else {
          errorBox.textContent = data.message || "Usuario o contraseña incorrectos.";
          errorBox.style.display = "block";
        }
      } catch (err) {
        console.error(err);
        errorBox.textContent = "Error al conectar con el servidor.";
        errorBox.style.display = "block";
      }
    });
  </script>
  <!-- 1. Cargar la librería externa de Socket.IO -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- 2. Código de conexión, cursor virtual y escuchadores para el mando/trackpad -->
  <script>
    const socket = io('https://weg-server-acces.onrender.com');

    // --- Crear la "bolita" (cursor virtual) en pantalla ---
    let cursor = document.getElementById('virtual-cursor');
    if (!cursor) {
      cursor = document.createElement('div');
      cursor.id = 'virtual-cursor';
      cursor.style.cssText = `
        position: fixed;
        width: 24px;
        height: 24px;
        background-color: #007bff;
        border: 3px solid #ffffff;
        border-radius: 50%;
        pointer-events: none;
        z-index: 999999;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
        top: 50%;
        left: 50%;
        display: block;
      `;
      document.body.appendChild(cursor);
    }

    let cursorX = window.innerWidth / 2;
    let cursorY = window.innerHeight / 2;

    function updatePosition(x, y) {
      cursorX = Math.max(10, Math.min(window.innerWidth - 10, x));
      cursorY = Math.max(10, Math.min(window.innerHeight - 10, y));
      cursor.style.left = cursorX + 'px';
      cursor.style.top = cursorY + 'px';
      cursor.style.display = 'block';
    }

    updatePosition(cursorX, cursorY);

    // Escuchar movimiento del trackpad
    socket.on('trackpad-move', (data) => {
      const dx = data.dx ?? data.deltaX ?? 0;
      const dy = data.dy ?? data.deltaY ?? 0;

      if (dx !== 0 || dy !== 0) {
        updatePosition(cursorX + dx, cursorY + dy);
        return;
      }

      if (typeof data.x === 'number' && typeof data.y === 'number') {
        const targetX = data.x <= 1 ? data.x * window.innerWidth : data.x;
        const targetY = data.y <= 1 ? data.y * window.innerHeight : data.y;
        updatePosition(targetX, targetY);
      }
    });

    // Escuchar clic del trackpad
    socket.on('trackpad-click', () => {
      const element = document.elementFromPoint(cursorX, cursorY);
      if (element) {
        element.click();
        element.focus();
      }
    });

    // Escuchar navegación D-Pad
    socket.on('control-action', (data) => {
      const action = data.action || data;
      if (action === 'down' || action === 'next') {
        if (document.activeElement === userInput) passInput.focus();
        else if (document.activeElement === passInput) loginBtn.focus();
      } else if (action === 'up' || action === 'prev') {
        if (document.activeElement === loginBtn) passInput.focus();
        else if (document.activeElement === passInput) userInput.focus();
      } else if (action === 'select' || action === 'click' || action === 'enter') {
        if (document.activeElement && document.activeElement.tagName !== 'BODY') {
          document.activeElement.click();
        } else {
          loginBtn.click();
        }
      }
    });

    // Escuchar escritura de teclado desde la tablet (limpiando espacios/saltos extra)
    socket.on('keyboard-input', (data) => {
      const key = typeof data === 'object' ? data.key : data;
      const activeEl = document.activeElement;

      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
        if (key === 'Backspace') {
          activeEl.value = activeEl.value.slice(0, -1);
        } else if (key === 'Enter') {
          loginBtn.click();
        } else if (typeof key === 'string' && key.length === 1) {
          activeEl.value += key;
        }
      }
    });
  </script>
</body>
</html>
